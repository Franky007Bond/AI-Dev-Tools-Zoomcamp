[project]
name = "backend"
version = "0.1.0"
description = "Waitly FastAPI backend (mock DB)"
authors = [
    { name = "Franky007Bond", email = "frank.merwerth@gmx.de" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
waitly-api = "backend.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
